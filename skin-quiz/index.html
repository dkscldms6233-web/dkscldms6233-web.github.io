<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skin Type Quiz · 피부타입 진단 퀴즈</title>
<style>
:root{
  --bg1:#eef4fb; --bg2:#f7eef3; --ink:#2f3e56; --sub:#6b7a92;
  --card:#ffffff; --line:#d9e3f0; --accent:#7ea6d6; --accent-ink:#ffffff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",Roboto,sans-serif;
  color:var(--ink);
  background:linear-gradient(160deg,var(--bg1),var(--bg2));
  background-attachment:fixed;
  min-height:100dvh;
  position:relative;
  display:flex;flex-direction:column;align-items:center;
  padding:max(14px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom));
  overflow-wrap:anywhere;word-break:keep-all;
}
.top{width:100%;max-width:480px;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.brand{font-size:13px;color:var(--sub);letter-spacing:.04em}
.lang{border:1px solid var(--line);background:rgba(255,255,255,.7);color:var(--ink);border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer}
main{width:100%;max-width:480px;flex:1;display:flex;flex-direction:column}
.panel{background:var(--card);border-radius:24px;padding:28px 22px;box-shadow:0 10px 30px rgba(80,110,160,.12);flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px}
h1{font-size:clamp(24px,7vw,32px);line-height:1.25}
h2{font-size:clamp(19px,5.4vw,23px);line-height:1.4}
p.lead{color:var(--sub);line-height:1.6;font-size:15px}
.flake{font-size:34px}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:16px;font-size:16px;font-weight:600;cursor:pointer;width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.count{font-size:13px;color:var(--sub)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:16px;padding:15px 16px;font-size:15px;line-height:1.45;cursor:pointer}
.opt:active,.opt:hover,.opt.sel{border-color:var(--accent);background:#f3f8fe}
.note{font-size:12px;color:var(--sub);text-align:center;margin-top:12px;line-height:1.5}

.snow{position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(circle,#fff 0 2px,transparent 3px),radial-gradient(circle,#fff 0 1.5px,transparent 2.5px),radial-gradient(circle,#fff 0 3px,transparent 4px);
  background-size:130px 150px,90px 110px,210px 190px;background-position:10px 20px,50px 70px,100px 40px;opacity:.7}
.top,main{position:relative;z-index:1}
.defs{position:absolute;width:0;height:0;overflow:hidden}
.hero{display:flex;justify-content:center}
.hero .face{width:128px;filter:drop-shadow(0 8px 14px rgba(190,120,110,.28))}
.face svg,.sw svg{display:block;width:100%;height:auto}
.sw{flex:none;width:54px;height:54px;border-radius:50%;overflow:hidden;background:#f1cdbd;border:2px solid #fff;box-shadow:0 2px 8px rgba(120,100,140,.18)}
.sw svg{height:100%}
.opt{display:flex;align-items:center;gap:12px}
.opt .tx{min-width:0;flex:1}
@media (max-width:340px){.sw{width:44px;height:44px}.opt{gap:10px;padding:12px}}

/* result: 9:16 story card */
.stage{display:flex;flex-direction:column;align-items:center;gap:12px}
.story{
  --w:min(calc(100vw - 32px),460px);
  width:var(--w);aspect-ratio:9/16;
  border-radius:22px;overflow:hidden;position:relative;
  background:linear-gradient(170deg,var(--c1),var(--c2));
  box-shadow:0 14px 40px rgba(60,90,140,.22);
  display:flex;flex-direction:column;
  padding:calc(var(--w)*.075);
  container-type:inline-size;
  color:#2b3a52;
}
.story .small{font-size:3.9cqw;letter-spacing:.08em;opacity:.75;text-align:center}
.story .head{text-align:center}
.story .face{width:38cqw;margin:1.5cqw auto 0;filter:drop-shadow(0 1.6cqw 3cqw rgba(190,110,110,.3))}
.story .face-wrap{position:relative}
.story .face-wrap::before,.story .face-wrap::after{content:var(--sym);position:absolute;font-size:6cqw}
.story .face-wrap::before{left:15cqw;top:5cqw}.story .face-wrap::after{right:14cqw;top:22cqw;font-size:4.6cqw}
.story .chip{display:table;margin:2.5cqw auto 0;background:rgba(255,255,255,.7);border-radius:99px;padding:1.1cqw 4cqw;font-size:4.3cqw;font-weight:700}
.story .type{font-size:9.4cqw;font-weight:800;line-height:1.15;margin-top:2cqw;text-align:center}
.story .prow{display:flex;align-items:center;gap:3.4cqw;background:rgba(255,255,255,.62);border-radius:4cqw;padding:2.6cqw 3.4cqw;margin-top:2.6cqw}
.story .prow.empty{background:rgba(255,255,255,.28);border:.4cqw dashed rgba(60,80,110,.3)}
.story .pface{flex:none;width:17cqw;height:17cqw;border-radius:50%;overflow:hidden;background:#f1cdbd;border:.6cqw solid #fff}
.story .pface svg{display:block;width:100%;height:100%}
.story .ptx{min-width:0;flex:1;line-height:1.3}
.story .pse{font-size:3.6cqw;opacity:.7}.story .pnm{font-size:5cqw;font-weight:800}.story .pty{font-size:3.6cqw;opacity:.8}
.story .ptitle{text-align:center;font-size:7.4cqw;font-weight:800;line-height:1.2;margin-top:3cqw}
.story .psub{text-align:center;font-size:4cqw;margin-top:1.6cqw;opacity:.85;line-height:1.4}
.stamp{font-size:11px;color:var(--sub);margin-top:2px}
.btn.wide{width:var(--w,100%);max-width:420px}
.minilink{background:none;border:0;color:var(--sub);font-size:13px;text-decoration:underline;cursor:pointer;padding:6px}
.story .tag{font-size:4.5cqw;margin-top:1.8cqw;opacity:.85;line-height:1.4;text-align:center}
.story ul{list-style:none;margin-top:5cqw;display:flex;flex-direction:column;gap:2.8cqw}
.story li{background:rgba(255,255,255,.62);border-radius:4cqw;padding:3.1cqw 4cqw;font-size:4.4cqw;line-height:1.42}
.story .foot{margin-top:auto;padding-top:2cqw;text-align:center;font-size:4.4cqw;line-height:1.5;font-weight:600}
.story .disc{margin-top:2.5cqw;text-align:center;font-size:3.1cqw;opacity:.7}
.hint{font-size:13px;color:var(--sub);text-align:center}
.row{display:flex;gap:10px;width:var(--w,100%);max-width:420px}
.hidden{display:none!important}
.seasons{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sbtn{border:1.5px solid #fff;border-radius:20px;padding:18px 10px;background:linear-gradient(160deg,var(--s1),var(--s2));color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 4px 14px rgba(80,110,160,.12);min-height:130px;justify-content:center}
.sbtn:active,.sbtn:hover{transform:translateY(-1px);border-color:var(--accent)}
.sbtn .ss{font-size:34px;line-height:1}.sbtn .sn{font-size:18px;font-weight:700}.sbtn .sh{font-size:12px;color:var(--sub);line-height:1.4;text-align:center}
body[data-season=spring]{--accent:#e58fae}body[data-season=summer]{--accent:#4fa8d6}body[data-season=autumn]{--accent:#d98c4f}body[data-season=winter]{--accent:#7ea6d6}
.row .btn{padding:14px}

/* result card animation */
.story .type .sx{font-size:.6em;font-weight:700;margin-left:.12em;white-space:nowrap}
@keyframes pop{0%{opacity:0;transform:scale(.55) translateY(4cqw)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes up{0%{opacity:0;transform:translateY(3.5cqw)}100%{opacity:1;transform:none}}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.8) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(25deg)}}
@keyframes drift{0%{transform:translateY(-.3px) rotate(-6deg)}100%{transform:translateY(.55px) rotate(7deg)}}
@keyframes glint{0%{opacity:.5;transform:scale(.9)}100%{opacity:1;transform:scale(1.12)}}
@keyframes beat{0%,100%{opacity:.72;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
.story .face{animation:pop .8s cubic-bezier(.2,.9,.3,1.2) .05s both}
.story .chip{animation:up .5s ease-out .4s both}
.story .type{animation:up .55s ease-out .55s both}
.story .tag{animation:up .5s ease-out .7s both}
.story li{animation:up .5s ease-out both}
.story li:nth-child(1){animation-delay:.9s}.story li:nth-child(2){animation-delay:1.05s}.story li:nth-child(3){animation-delay:1.2s}
.story .foot{animation:up .5s ease-out 1.35s both}
.story .face-wrap::before,.story .face-wrap::after{animation:twinkle 2.6s ease-in-out infinite}
.story .face-wrap::after{animation-delay:1.1s}
.story .face .fk,.story .face .sh,.story .face .bl{transform-box:fill-box;transform-origin:center}
.story .face .fk{animation:drift 2.4s ease-in-out infinite alternate}
.story .face .sh{animation:glint 1.9s ease-in-out infinite alternate}
.story .face .bl{animation:beat 2.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.story *,.story *::before,.story *::after{animation:none!important}}
.rec{width:var(--w,100%);max-width:420px;background:rgba(255,255,255,.85);border-radius:18px;padding:16px;box-shadow:0 4px 14px rgba(80,110,160,.1)}
.rec h3{font-size:15px;margin-bottom:10px}
.rec ul{list-style:none;display:flex;flex-direction:column;gap:10px}
.rec li b{display:block;font-size:14px}.rec li span{display:block;font-size:13px;color:var(--sub);margin-top:2px;line-height:1.45}
.rec p{font-size:11.5px;color:var(--sub);margin-top:12px;line-height:1.55}

.friendb{display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,#fde4ec,#e3eefb);border-radius:18px;padding:12px 14px;font-size:14px;line-height:1.45}
.fb-face{flex:none;width:52px;height:52px;border-radius:50%;overflow:hidden;background:#f1cdbd;border:2px solid #fff}.fb-face svg{display:block;width:100%;height:100%}
.pic{flex:none;width:44px;height:44px;display:block}.pic svg{display:block;width:100%;height:100%}
.rec li{display:flex;gap:12px;align-items:flex-start}
.rec li em{display:block;font-style:normal;font-size:12.5px;color:#c0566f;margin-top:4px;line-height:1.45}
.toast{width:var(--w,100%);max-width:420px;text-align:center;background:#2f3e56;color:#fff;border-radius:12px;padding:10px 12px;font-size:13px}
.story .mrow{display:flex;align-items:flex-start;justify-content:center;gap:2cqw;margin-top:3cqw}
.story .mcol{width:36cqw;text-align:center}
.story .mface{width:28cqw;margin:0 auto;animation:pop .8s cubic-bezier(.2,.9,.3,1.2) .05s both;filter:drop-shadow(0 1.6cqw 3cqw rgba(190,110,110,.3))}
.story .mface svg{display:block;width:100%;height:auto}
.story .mn{font-size:4.2cqw;font-weight:800;line-height:1.3;margin-top:2cqw}
.story .mheart{font-size:9cqw;color:#e0526f;margin-top:10cqw;animation:beat 1.4s ease-in-out infinite}
.story .mpct{text-align:center;font-size:17cqw;font-weight:800;line-height:1;margin-top:5cqw;color:#d6456a;animation:up .6s ease-out .5s both}
.story .mline{text-align:center;font-size:4.4cqw;line-height:1.45;margin-top:2cqw;font-weight:600;animation:up .5s ease-out .7s both}
.story .mtitle{text-align:center;font-size:3.8cqw;opacity:.75;margin-top:6cqw;letter-spacing:.04em}
.story .mprods{display:flex;flex-direction:column;gap:2.4cqw;margin-top:2.4cqw}
.story .mp{display:flex;align-items:center;gap:3cqw;background:rgba(255,255,255,.65);border-radius:4cqw;padding:2.2cqw 3.4cqw;font-size:3.9cqw;font-weight:600;line-height:1.35}
.story .mp .pic{width:10cqw;height:10cqw}
.story .mface .fk,.story .mface .sh,.story .mface .bl{transform-box:fill-box;transform-origin:center}
.story .mface .fk{animation:drift 2.4s ease-in-out infinite alternate}.story .mface .sh{animation:glint 1.9s ease-in-out infinite alternate}.story .mface .bl{animation:beat 2.2s ease-in-out infinite}
.rec .br{display:block;font-size:11.5px;letter-spacing:.05em;color:#c0566f;font-weight:700;text-transform:uppercase;margin-bottom:1px}
.story .mp span{min-width:0}.story .mp small{display:block;font-size:3.1cqw;letter-spacing:.05em;color:#c0566f;font-weight:700;text-transform:uppercase}
</style>
</head>
<body>
<div class="snow" aria-hidden="true"></div>
<svg class="defs" width="0" height="0" aria-hidden="true" focusable="false"><defs>
  <radialGradient id="skinBase" cx="50%" cy="40%" r="72%"><stop offset="0" stop-color="#fdebe1"/><stop offset=".55" stop-color="#f7d6c8"/><stop offset="1" stop-color="#ecbaa8"/></radialGradient>
  <radialGradient id="blush"><stop offset="0" stop-color="#e45a68" stop-opacity=".7"/><stop offset=".6" stop-color="#e9707a" stop-opacity=".3"/><stop offset="1" stop-color="#e9707a" stop-opacity="0"/></radialGradient>
  <radialGradient id="shine"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset=".55" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .62  0 0 0 0 .38  0 0 0 0 .32  0 0 0 1.4 -.5"/></filter>

</div>
<main id="app"></main>

    case 'oily': return shine(100,62,38,12)+shine(100,120,11,36)+shine(100,208,26,8)+shine(54,152,19,11)+shine(146,152,19,11)+pores(7,34,38,162,92,200)+drops();
    case 'combo': return shine(100,62,38,12)+shine(100,120,11,36)+pores(11,16,86,114,95,170)+crack('M40 150 q9 -5 15 2 t15 -2')+crack('M130 160 q9 4 15 -2 t14 3')+CHEEK_FLAKES.map(f=>flake(...f)).join('');
    case 'sensitive': return `<ellipse class="bl" cx="54" cy="150" rx="38" ry="32" fill="url(#blush)"/><ellipse class="bl" style="animation-delay:.25s" cx="146" cy="150" rx="38" ry="32" fill="url(#blush)"/><ellipse class="bl" style="animation-delay:.5s" cx="100" cy="152" rx="15" ry="11" fill="url(#blush)" fill-opacity=".7"/><ellipse cx="100" cy="72" rx="46" ry="16" fill="url(#blush)" fill-opacity=".35"/>`+
      ['M38 140 q6 -7 12 0 t10 5','M42 158 q8 3 13 -5 t9 2','M162 140 q-6 -7 -12 0 t-10 5','M158 158 q-8 3 -13 -5 t-9 2','M92 148 q4 -4 8 0 t8 2'].map(d=>`<path d="${d}" fill="none" stroke="#d6414f" stroke-opacity=".45" stroke-width=".8" stroke-linecap="round"/>`).join('')+pores(5,14,36,164,125,175,'#d6414f');
    default: return '';
  }
}
const CROP={dry:"18 112 84 84",oily:"60 78 80 80",combo:"56 92 88 88",sensitive:"18 112 84 84"};
function skin(type,swatch){
  const vb=swatch&&CROP[type]?CROP[type]:"0 0 200 250";
  return `<svg viewBox="${vb}" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
    <ellipse cx="100" cy="125" rx="80" ry="105" fill="url(#skinBase)"/>
    <g clip-path="url(#faceClip)"><rect width="200" height="250" filter="url(#grain)" opacity="${type==='oily'?.14:.34}"/>${fx(type)}</g>
    <ellipse cx="100" cy="125" rx="80" ry="105" fill="none" stroke="#d9a493" stroke-opacity=".45" stroke-width="1.2"/>
  </svg>`;
}

let lang = "ko"; // 처음 들어오면 항상 한국어로 시작 (오른쪽 위 버튼으로 English 전환)
let idx = -1, picks = [];
const app = document.getElementById("app");
const langBtn = document.getElementById("lang");
/* ---- 효과음: Web Audio로 직접 합성(음원 파일·저작권 없음). 오른쪽 위 🔊 버튼으로 끄고 켤 수 있음 ---- */
let audioCtx=null, muted=false, sfxPending=false;
try{muted=localStorage.getItem("skinMute")==="1"}catch(e){}
function ac(){try{if(!audioCtx){const C=window.AudioContext||window.webkitAudioContext;if(C)audioCtx=new C()}if(audioCtx&&audioCtx.state==="suspended")audioCtx.resume();}catch(e){}return audioCtx}
function tone(f,t0,d,type,vol,slideTo){const c=ac();if(!c||muted)return;try{const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+t0;o.type=type||"sine";o.frequency.setValueAtTime(f,t);if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.1,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}
function noise(t0,d,vol,hp){const c=ac();if(!c||muted)return;try{const n=Math.floor(c.sampleRate*d),b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain(),t=c.currentTime+t0;s.buffer=b;f.type="highpass";f.frequency.value=hp||3000;g.gain.value=vol||.08;s.connect(f);f.connect(g);g.connect(c.destination);s.start(t)}catch(e){}}
const SFX={
  tap:()=>tone(640,0,.09,"triangle",.1,900),
  go:()=>{tone(520,0,.08,"sine",.09);tone(780,.07,.12,"sine",.09)},
  season:()=>{tone(600,0,.1,"triangle",.1);tone(900,.07,.16,"triangle",.1)},
  back:()=>tone(520,0,.1,"sine",.08,360),
  copy:()=>{tone(880,0,.08,"square",.04);tone(1320,.08,.16,"square",.04)},
  match:()=>{[523,659,784,1046].forEach((f,i)=>tone(f,i*.12,i===3?.45:.18,"sine",.1));tone(1568,.5,.3,"sine",.05)},
  result:k=>{
    const base={dry:523,oily:587,combo:659,sensitive:494}[k]||523;
    [1,1.25,1.5,2,2.5].forEach((m,i)=>tone(base*m,i*.09,.4,"sine",.09));tone(base/2,0,.6,"triangle",.06);
    if(k==="dry"||k==="combo"){for(let i=0;i<4;i++)noise(.05+i*.07,.05,.06,4500)}        // 바삭, 각질 소리
    if(k==="oily"||k==="combo"){tone(380,.1,.35,"sine",.06,1300)}                          // 반질, 미끄러지는 소리
    if(k==="sensitive"){tone(90,.05,.18,"sine",.2);tone(80,.26,.22,"sine",.2)}            // 두근두근
  }
};
function paintSnd(){const b=document.getElementById("snd");if(b)b.textContent=muted?"🔇":"🔊"}
paintSnd();
document.getElementById("snd").onclick=()=>{muted=!muted;try{localStorage.setItem("skinMute",muted?"1":"0")}catch(e){}paintSnd();SFX.tap()};

function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function nl(s){return esc(s).replace(/\n/g,"<br>")}

function render(){
  const t = T[lang];
  document.documentElement.lang = lang;
  langBtn.textContent = t.switchTo;
  document.title = lang==="ko" ? "피부타입 진단 퀴즈" : "Skin Type Quiz";
  if(idx===-4) return renderMatch(t);
  if(idx===-3) return renderPass(t);
  if(idx===-2) return renderSeason(t);
  if(idx<0) return renderIntro(t);
  if(idx>=t.q.length) return renderResult(t);
  renderQ(t);
}
function renderIntro(t){
  app.innerHTML = `<section class="panel">
    ${friend?`<div class="friendb"><div class="fb-face">${skin(friend.type,true)}</div><div><b>${esc(t.friendIs(NICK[lang][friend.season][friend.type]+(lang==="ko"?" 타입":" Type")))}</b><br>${esc(t.friendAsk)}</div></div>`:""}
    <div class="hero"><div class="face">${skin('base')}</div></div>
    <h1>${esc(t.title)}</h1>
    <p class="lead">${nl(t.lead)}</p>
    <button class="btn" id="go" type="button">${esc(t.start)}</button>
    <p class="note" style="margin-top:0">${esc(t.note)}</p>
  </section>`;
  document.getElementById("go").onclick=()=>{SFX.go();idx=-2;picks=[];render()};
}
function renderSeason(t){
  app.innerHTML = `<section class="panel">
    <h2>${esc(t.seasonQ)}</h2>
    <div class="seasons">${Object.keys(SEASONS).map(k=>{const S=SEASONS[k];return `<button class="sbtn" type="button" data-s="${k}" style="--s1:${S.c[0]};--s2:${S.c[1]}"><span class="ss">${S.sym}</span><span class="sn">${esc(lang==="ko"?S.ko:S.EN)}</span><span class="sh">${esc(lang==="ko"?S.hk:S.he)}</span>${getPass()[k]?`<span class="stamp">✓ ${esc(t.types[getPass()[k].type].name)}</span>`:""}</button>`}).join("")}</div>
    ${passCount()?`<button class="btn ghost" id="pp" type="button">${esc(t.passBtn)} (${passCount()}/4)</button>`:""}
    <button class="minilink" id="bs" type="button">${esc(t.toStart)}</button>
    <p class="note" style="margin-top:0">${esc(t.note)}</p>
  </section>`;
  document.getElementById("bs").onclick=()=>{SFX.back();idx=-1;render();window.scrollTo(0,0)};
  const pp=document.getElementById("pp");if(pp)pp.onclick=()=>{SFX.go();idx=-3;render();window.scrollTo(0,0)};
  app.querySelectorAll(".sbtn").forEach(b=>b.onclick=()=>{SFX.season();season=b.dataset.s;document.body.dataset.season=season;idx=0;picks=[];render();window.scrollTo(0,0)});
}
function renderQ(t){
  const q=t.q[idx], total=t.q.length;
  app.innerHTML = `<section class="panel">
    <div><div class="count" style="display:flex;justify-content:space-between;align-items:center"><span>${t.of(idx+1,total)}</span><button class="minilink" id="bk" type="button" style="padding:0">${esc(t.prev)}</button></div>
    <div class="progress" style="margin-top:8px"><i style="width:${(idx/total)*100}%"></i></div></div>
    <h2>${esc(q.t.replace('{s}',lang==='ko'?SEASONS[season].ko:SEASONS[season].en))}</h2>
    <div class="opts">${q.o.map((o,i)=>`<button class="opt${picks[idx]===o[1]?" sel":""}" type="button" data-i="${i}"><span class="sw">${skin(o[1],true)}</span><span class="tx">${esc(o[0])}</span></button>`).join("")}</div>
    <p class="note" style="margin-top:0">${esc(t.note)}</p>
  </section>`;
  document.getElementById("bk").onclick=()=>{SFX.back();idx=idx>0?idx-1:-2;render();window.scrollTo(0,0)};
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    picks[idx]=T.ko.q[idx].o[+b.dataset.i][1]; // type key is identical across languages (same order)
    idx++; if(idx>=T[lang].q.length)sfxPending=true; else SFX.tap(); render(); window.scrollTo(0,0);
  });
}
function result(){
  const score={dry:0,oily:0,combo:0,sensitive:0};
  picks.forEach(k=>score[k]++);
  const max=Math.max(...Object.values(score));
  // tie → the most recently chosen among the tied types
  for(let i=picks.length-1;i>=0;i--) if(score[picks[i]]===max) return picks[i];
}
function shareMe(k,nick){
  const t=T[lang], url=location.origin+location.pathname+`?t=${k}&s=${season}`;
  const text=t.shareText(nick);
  const toast=document.getElementById("toast");
  const done=()=>{SFX.copy();if(toast){toast.textContent=t.copied;toast.classList.remove("hidden");setTimeout(()=>toast.classList.add("hidden"),2600)}};
  if(navigator.share){navigator.share({title:document.title,text,url}).catch(()=>{});return}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text+" "+url).then(done,()=>{window.prompt("Copy",text+" "+url)});return}
  window.prompt("Copy",text+" "+url);
}
function renderMatch(t){
  const k=result(), S=SEASONS[season], F=friend||{type:k,season:season};
  const [pct,ko,en]=matchOf(k,F.type);
  const my=PRODUCTS[k][0], fr=PRODUCTS[F.type][k===F.type?1:0];
  const nick=(sea,ty)=>NICK[lang][sea][ty]+(lang==="ko"?" 타입":" Type");
  const prod=x=>{const n=splitName(x[0]);return `<div class="mp"><i class="pic">${pIcon(x[3],x[4])}</i><span><small>${esc(brandLine(n))}</small>${esc(n.prod)}</span></div>`};
  app.innerHTML=`<section class="stage">
    <div class="story" style="--c1:#fde4ec;--c2:#dcebfa" id="card">
      <div class="small">${esc(t.matchSmall)}</div>
      <div class="mrow">
        <div class="mcol"><div class="mface">${skin(k)}</div><div class="mn">${esc(nick(season,k))}</div></div>
        <div class="mheart">♥</div>
        <div class="mcol"><div class="mface">${skin(F.type)}</div><div class="mn">${esc(nick(F.season,F.type))}</div></div>
      </div>
      <div class="mpct">${pct}%</div>
      <div class="mline">${esc(lang==="ko"?ko:en)}</div>
      <div class="mtitle">${esc(t.comboTitle)}</div>
      <div class="mprods">${prod(my)}${prod(fr)}</div>
      <div class="foot">${nl(t.foot)}</div>
      <div class="disc">${esc(t.disc)}</div>
    </div>
    <p class="hint">${esc(t.hint)}</p>
    <button class="btn wide" id="share" type="button">${esc(t.shareBtn)}</button>
    <button class="btn ghost wide" id="bk" type="button">${esc(t.back)}</button>
    <div class="toast hidden" id="toast"></div>
  </section>`;
  document.getElementById("share").onclick=()=>shareMe(k,NICK[lang][season][k]);
  document.getElementById("bk").onclick=()=>{SFX.back();idx=6;render();window.scrollTo(0,0)};
}
function renderPass(t){
  const P=getPass(), n=passCount();
  const done=Object.keys(SEASONS).map(k=>P[k]&&P[k].type).filter(Boolean);
  const uniq=new Set(done).size;
  let sub=n<4?t.passLeft:(uniq===1?(lang==="ko"?"1년 내내 같은 타입이에요":"Same type all year"):(lang==="ko"?`계절 따라 ${uniq}가지 타입으로 바뀌어요`:`Your skin shifts across ${uniq} types`));
  const rows=Object.keys(SEASONS).map(k=>{const S=SEASONS[k],e=P[k];
    return e?`<div class="prow"><div class="pface">${skin(e.type,true)}</div><div class="ptx"><div class="pse">${S.sym} ${esc(lang==="ko"?S.ko:S.EN)}</div><div class="pnm">${esc(NICK[lang][k][e.type])}</div><div class="pty">${esc(t.types[e.type].name)}</div></div></div>`
      :`<div class="prow empty"><div class="pface" style="background:transparent;border-style:dashed"></div><div class="ptx"><div class="pse">${S.sym} ${esc(lang==="ko"?S.ko:S.EN)}</div><div class="pty">${esc(t.empty)}</div></div></div>`}).join("");
  app.innerHTML=`<section class="stage">
    <div class="story" style="--c1:#e6eefb;--c2:#f7e9f0" id="card">
      <div class="small">${esc(t.passSmall)} · ${n}/4</div>
      <div class="ptitle">${esc(n===4?t.passDone:t.passTitle)}</div>
      <div class="psub">${esc(sub)}</div>
      <ul style="display:none"></ul>
      <div style="margin-top:2cqw">${rows}</div>
      <div class="foot">${nl(t.foot)}</div>
      <div class="disc">${esc(t.disc)}</div>
    </div>
    <p class="hint">${esc(t.hint)}</p>
    <button class="btn wide" id="bk" type="button">${esc(t.back)}</button>
    <button class="minilink" id="rs" type="button">${esc(t.reset)}</button>
  </section>`;
  document.getElementById("bk").onclick=()=>{SFX.back();idx=-2;render();window.scrollTo(0,0)};
  document.getElementById("rs").onclick=()=>{setPass({});render()};
}
function renderResult(t){
  const k=result(); if(sfxPending){sfxPending=false;SFX.result(k)} if(picks.length===6){const P=getPass();P[season]={type:k};setPass(P)} const ty=t.types[k], S=SEASONS[season], [c1,c2]=S.c, tips=[ty.tips[0],...ST[lang][season][k]];
  app.innerHTML = `<section class="stage">
    <div class="story" style="--c1:${c1};--c2:${c2};--sym:'${S.sym}'" id="card">
      <div class="small">${esc(t.small)} · ${esc(lang==='ko'?S.ko:S.EN)}</div>
      <div class="face-wrap"><div class="face">${skin(k)}</div></div>
      <div class="chip">${esc(ty.name)}</div>
      <div class="type">${esc(NICK[lang][season][k])}<span class="sx">${lang==="ko"?" 타입":" Type"}</span></div>
      <div class="tag">${esc(ty.tag)}</div>
      <ul>${tips.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
      <div class="foot">${nl(t.foot)}</div>
      <div class="disc">${esc(t.disc)}</div>
    </div>
    <p class="hint">${esc(t.hint)} · ${esc(t.stamped)} ${passCount()}/4</p>
    ${PRODUCTS[k]?`<div class="rec"><h3>${esc(t.recTitle(ty.name))}</h3><ul>${PRODUCTS[k].map(x=>`<li><i class="pic">${pIcon(x[3],x[4])}</i><div>${(()=>{const n=splitName(x[0]);return `<small class="br">${esc(brandLine(n))}</small><b>${esc(n.prod)}</b>`})()}<span>${esc(lang==="ko"?x[1]:x[2])}</span><em>💗 ${esc(t.matchLabel)}: ${esc(lang==="ko"?x[5]:x[6])}</em></div></li>`).join("")}</ul><p>${esc(t.recNote)} ${esc(t.illus)}</p></div>`:""}
    <button class="btn wide" id="share" type="button">${esc(t.shareBtn)}</button>
    ${friend?`<button class="btn wide" id="cmp" type="button">${esc(t.compBtn)}</button>`:""}
    <div class="toast hidden" id="toast"></div>
    <button class="btn wide" id="pass" type="button">${passCount()===4?"✨ ":""}${esc(passCount()===4?t.passDone:t.passBtn+" ("+passCount()+"/4)")}</button>
    <div class="row"><button class="btn ghost" id="again" type="button">${esc(t.again)}</button><button class="btn ghost" id="other" type="button">${esc(t.other)}</button></div>
  </section>`;
  document.getElementById("share").onclick=()=>shareMe(k,NICK[lang][season][k]);
  const cmp=document.getElementById("cmp");if(cmp)cmp.onclick=()=>{SFX.match();idx=-4;render();window.scrollTo(0,0)};
  document.getElementById("pass").onclick=()=>{SFX.go();idx=-3;render();window.scrollTo(0,0)};
  document.getElementById("again").onclick=()=>{SFX.go();idx=0;picks=[];render();window.scrollTo(0,0)};
  document.getElementById("other").onclick=()=>{SFX.go();idx=-2;picks=[];render();window.scrollTo(0,0)};
}
langBtn.onclick=()=>{lang=lang==="ko"?"en":"ko";render()};
render();
</script>
